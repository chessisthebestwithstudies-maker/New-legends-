<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Legends - Member Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 1.1em;
            color: #aaa;
        }
        
        .widget-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
            background: #0f0f0f;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            border-radius: 5px;
            color: #ddd;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            iframe {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 New Legends</h1>
            <p>Chess Club Member Tracker</p>
        </div>
        
        <div class="widget-container">
            <iframe src="https://capable-custard-19ee1e.netlify.app/widget.html?club=group-2cb3abd069b8e7f7b7904b657499a7e6" 
                    title="New Legends Member Tracker"
                    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"
                    allowfullscreen>
            </iframe>
            
            <div class="info">
                <strong>💡 About:</strong> This page displays your chess club's member tracker, showing the latest additions to your New Legends group on chess.com with their rapid ratings and join times.
            </div>
        </div>
    </div>
</body>
</html>
